services:
  - type: web
    name: govt-benefits-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FLASK_DEBUG
        value: "0"
      # Set this to your live URL after the first deploy, then redeploy.
      # sitemap.xml and the canonical tags need the absolute domain.
      - key: SITE_URL
        value: https://govt-benefits-assistant.onrender.com
